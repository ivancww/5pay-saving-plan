<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="description" content="AVA Saving：用自然對話，預先睇到未來資源。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>AVA Saving</title>
</head>
<body>
  <div class="ava-shell">
    <header class="app-header">
      <a class="brand" href="?" aria-label="AVA Saving 首頁"><span class="brand-mark">A</span><span class="brand-copy"><span class="brand-identity">AVA Saving <small class="app-version" id="app-version" aria-label="版本"></small></span><small class="journey-title">5PAY 儲蓄規劃</small></span></a>
      <div class="header-actions">
        <a class="ava-button ava-button--subtle return-ava" id="return-ava" href="./" aria-label="返回 AVA"><svg class="return-ava__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/><path d="M9 12h10"/></svg><span>返回 AVA</span></a>
        <button class="ava-button ava-button--subtle" id="edit-toggle" type="button">編輯前台</button>
        <button class="ava-button ava-button--subtle" id="customer-view-button" type="button">客戶頁</button>
        <button class="ava-button ava-button--icon" id="reset-session" type="button" aria-label="重新開始">↻</button>
      </div>
    </header>
    <main class="ava-front" id="app" data-ava-mode="use" aria-live="polite"></main>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
